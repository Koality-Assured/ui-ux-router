name: Harness template CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile kept Python
        run: python -m compileall -q -f scripts .harness
      - name: Script tests
        run: |
          python -m pip install --quiet pyyaml==6.0.2 cryptography==43.0.1 ruff bandit
          if [ -d scripts/tests ]; then python -m unittest discover -s scripts/tests -v; fi
      - name: Lint with ruff
        run: ruff check scripts
      - name: Security scan with bandit
        run: bandit -r scripts
