<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">UI/UX Router Banner</title>
  <desc id="bannerDesc">Authoritative hero banner for UI/UX Router featuring design systems, WCAG 2.2 AAA accessibility iris, DTCG design tokens, and visual regression testing.</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="45%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080C16"/>
    </linearGradient>

    <!-- Spectrum Text & Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="35%" stop-color="#8B5CF6"/>
      <stop offset="70%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <linearGradient id="cyanToViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="violetToFuchsia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="30%" stop-color="#8B5CF6"/>
      <stop offset="70%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <linearGradient id="penNibGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Ambient Radial Glows -->
    <radialGradient id="leftGlow" cx="15%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#060911" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="centerGlow" cx="60%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#D946EF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#060911" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="rightGlow" cx="85%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#D946EF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#060911" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter Glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="1200" height="360" fill="url(#bannerBg)"/>

  <!-- Ambient Light Washes -->
  <rect x="0" y="0" width="1200" height="360" fill="url(#leftGlow)"/>
  <rect x="0" y="0" width="1200" height="360" fill="url(#centerGlow)"/>
  <rect x="0" y="0" width="1200" height="360" fill="url(#rightGlow)"/>

  <!-- Top and Bottom Accent Borders -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#borderGrad)"/>
  <rect x="0" y="357" width="1200" height="3" fill="url(#borderGrad)"/>

  <!-- Blueprint & Artboard Grid Pattern (Background Right) -->
  <g opacity="0.15" stroke="#475569" stroke-width="1">
    <line x1="680" y1="20" x2="680" y2="340" stroke-dasharray="4,6"/>
    <line x1="760" y1="20" x2="760" y2="340" stroke-dasharray="4,6"/>
    <line x1="840" y1="20" x2="840" y2="340" stroke-dasharray="4,6"/>
    <line x1="920" y1="20" x2="920" y2="340" stroke-dasharray="4,6"/>
    <line x1="1000" y1="20" x2="1000" y2="340" stroke-dasharray="4,6"/>
    <line x1="1080" y1="20" x2="1080" y2="340" stroke-dasharray="4,6"/>
    <line x1="1160" y1="20" x2="1160" y2="340" stroke-dasharray="4,6"/>

    <line x1="650" y1="60" x2="1180" y2="60" stroke-dasharray="4,6"/>
    <line x1="650" y1="120" x2="1180" y2="120" stroke-dasharray="4,6"/>
    <line x1="650" y1="180" x2="1180" y2="180" stroke-dasharray="4,6"/>
    <line x1="650" y1="240" x2="1180" y2="240" stroke-dasharray="4,6"/>
    <line x1="650" y1="300" x2="1180" y2="300" stroke-dasharray="4,6"/>
  </g>

  <!-- ================= LEFT BRANDING SECTION ================= -->
  <g transform="translate(68, 52)">
    <!-- Eyebrow Pill Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="224" height="28" rx="14" fill="#0F172A" stroke="#06B6D4" stroke-width="1.2" stroke-opacity="0.8"/>
      <circle cx="14" cy="14" r="4.5" fill="#22D3EE" filter="url(#softGlow)"/>
      <text x="27" y="18" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">KOALITY-ASSURED HARNESS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="82" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-size="46" font-weight="900" letter-spacing="1.5">UI / UX ROUTER</text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="118" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" letter-spacing="0.3">
      Domain AI Agent Harness for Design Systems, Accessibility &amp; Visual Precision
    </text>

    <!-- Detailed Subtitle Line -->
    <text x="0" y="144" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400">
      W3C DTCG Token Compilation • Automated WCAG 2.2 AAA Audits • Playwright Visual Gating
    </text>

    <!-- Capability Badges Row -->
    <g transform="translate(0, 184)">
      <!-- Badge 1: W3C DTCG Tokens -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="138" height="30" rx="8" fill="#0F172A" stroke="#22D3EE" stroke-width="1.2" stroke-opacity="0.7"/>
        <circle cx="14" cy="15" r="4" fill="#22D3EE"/>
        <text x="26" y="19" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">DTCG Tokens</text>
      </g>

      <!-- Badge 2: WCAG 2.2 AAA -->
      <g transform="translate(148, 0)">
        <rect x="0" y="0" width="144" height="30" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.2" stroke-opacity="0.8"/>
        <circle cx="14" cy="15" r="4" fill="#10B981"/>
        <text x="26" y="19" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">WCAG 2.2 AAA</text>
      </g>

      <!-- Badge 3: Visual Regression -->
      <g transform="translate(302, 0)">
        <rect x="0" y="0" width="158" height="30" rx="8" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.2" stroke-opacity="0.8"/>
        <circle cx="14" cy="15" r="4" fill="#8B5CF6"/>
        <text x="26" y="19" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Visual Regression</text>
      </g>

      <!-- Badge 4: Breakpoints -->
      <g transform="translate(470, 0)">
        <rect x="0" y="0" width="150" height="30" rx="8" fill="#0F172A" stroke="#D946EF" stroke-width="1.2" stroke-opacity="0.8"/>
        <circle cx="14" cy="15" r="4" fill="#D946EF"/>
        <text x="26" y="19" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">4x Breakpoints</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT ILLUSTRATION SECTION ================= -->
  <!-- Multi-Layer Artboard Frame Representation (Desktop 1920 / Tablet 768 / Mobile 375) -->
  <g transform="translate(730, 42)">
    <!-- Base Large Artboard Frame -->
    <rect x="0" y="0" width="410" height="276" rx="16" fill="#090E1B" stroke="#334155" stroke-width="1.8"/>
    <!-- Artboard Titlebar -->
    <path d="M 0,16 Q 0,0 16,0 L 394,0 Q 410,0 410,16 L 410,32 L 0,32 Z" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="4" fill="#F43F5E"/>
    <circle cx="28" cy="16" r="4" fill="#F59E0B"/>
    <circle cx="40" cy="16" r="4" fill="#10B981"/>
    <text x="60" y="20" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Viewport: 1920 × 1080 (Desktop Canvas)</text>

    <!-- Nested Responsive Breakpoint Frame (Tablet: 768) -->
    <rect x="36" y="52" width="220" height="196" rx="10" fill="#070C18" stroke="#8B5CF6" stroke-width="1.4" stroke-opacity="0.4" stroke-dasharray="5,5"/>
    <text x="44" y="68" fill="#8B5CF6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" opacity="0.8">768px Tablet</text>

    <!-- Mobile Breakpoint Frame (Mobile: 375) -->
    <rect x="56" y="86" width="100" height="144" rx="6" fill="#0B132B" stroke="#22D3EE" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="3,4"/>
    <text x="64" y="102" fill="#22D3EE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" opacity="0.8">375px</text>

    <!-- Flowing Bezier Spline across Canvas -->
    <path d="M 40,210 C 120,250 180,120 270,160 C 330,190 360,110 390,130" fill="none" stroke="url(#titleGrad)" stroke-width="3.8" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M 40,210 C 120,250 180,120 270,160 C 330,190 360,110 390,130" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.6"/>

    <!-- Tangent Line & Anchors -->
    <line x1="220" y1="130" x2="320" y2="190" stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.7"/>
    <circle cx="220" cy="130" r="4" fill="#22D3EE" stroke="#0F172A" stroke-width="1.5"/>
    <circle cx="320" cy="190" r="4" fill="#D946EF" stroke="#0F172A" stroke-width="1.5"/>
    <rect x="266" y="156" width="8" height="8" rx="1.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5"/>

    <!-- Bezier Pen Tool Crafting Vector -->
    <g transform="translate(330, 94) rotate(-38)">
      <path d="M -10,-40 L 10,-40 L 12,-12 L -12,-12 Z" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
      <rect x="-11" y="-12" width="22" height="5" rx="1" fill="url(#violetToFuchsia)"/>
      <path d="M -11,-7 L 11,-7 L 8,20 L 0,38 L -8,20 Z" fill="url(#penNibGrad)" stroke="#475569" stroke-width="1.2"/>
      <circle cx="0" cy="11" r="2.8" fill="#090E1B"/>
      <line x1="0" y1="14" x2="0" y2="38" stroke="#090E1B" stroke-width="1.6"/>
      <circle cx="0" cy="38" r="2.5" fill="#22D3EE" filter="url(#softGlow)"/>
    </g>

    <!-- WCAG 2.2 AAA Accessibility Iris Widget -->
    <g transform="translate(230, 48)">
      <circle cx="32" cy="32" r="30" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5" filter="url(#softGlow)"/>
      <!-- Aperture Blended Arc -->
      <path d="M 32,8 A 24,24 0 0,0 32,56 A 24,24 0 0,1 32,8 Z" fill="#22D3EE" fill-opacity="0.25" stroke="#22D3EE" stroke-width="1.8"/>
      <path d="M 32,8 A 24,24 0 0,1 32,56 A 24,24 0 0,0 32,8 Z" fill="#D946EF" fill-opacity="0.25" stroke="#D946EF" stroke-width="1.8"/>
      <circle cx="32" cy="32" r="9" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
      <circle cx="32" cy="32" r="3.5" fill="#10B981"/>
      <!-- Contrast Ratio Callout Badge -->
      <rect x="68" y="18" width="62" height="24" rx="6" fill="#090E1B" stroke="#10B981" stroke-width="1.2"/>
      <text x="74" y="34" fill="#10B981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">7.2:1 AAA</text>
    </g>

    <!-- Floating DTCG Design Token Pills -->
    <!-- Token 1 -->
    <g transform="translate(180, 218)">
      <rect x="0" y="0" width="104" height="22" rx="11" fill="#0F172A" stroke="#06B6D4" stroke-width="1.2" filter="url(#softGlow)"/>
      <circle cx="10" cy="11" r="4" fill="#22D3EE"/>
      <text x="20" y="15" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">$color.brand</text>
    </g>

    <!-- Token 2 -->
    <g transform="translate(296, 218)">
      <rect x="0" y="0" width="98" height="22" rx="11" fill="#0F172A" stroke="#D946EF" stroke-width="1.2" filter="url(#softGlow)"/>
      <circle cx="10" cy="11" r="4" fill="#D946EF"/>
      <text x="20" y="15" fill="#F1F5F9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">$target: 48px</text>
    </g>

    <!-- Artboard Corner Handles -->
    <rect x="-4" y="-4" width="8" height="8" rx="1" fill="#22D3EE" stroke="#090E1B" stroke-width="1.5"/>
    <rect x="406" y="-4" width="8" height="8" rx="1" fill="#22D3EE" stroke="#090E1B" stroke-width="1.5"/>
    <rect x="-4" y="272" width="8" height="8" rx="1" fill="#22D3EE" stroke="#090E1B" stroke-width="1.5"/>
    <rect x="406" y="272" width="8" height="8" rx="1" fill="#22D3EE" stroke="#090E1B" stroke-width="1.5"/>
  </g>
</svg>
