<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">UI/UX Router Logo</title>
  <desc id="logoDesc">Emblem combining design system artboard frames, bezier pen anchor handles, WCAG accessibility iris aperture, and DTCG design tokens on an obsidian canvas.</desc>
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D18"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#8B5CF6" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#D946EF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Core Spectrum Gradients -->
    <linearGradient id="cyanToViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="violetToFuchsia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#C026D3"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <linearGradient id="fuchsiaToCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D946EF"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="penNibGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="80%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="penAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#D946EF"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.14"/>
      <stop offset="80%" stop-color="#D946EF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#070A12" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="irisGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container Card -->
  <rect x="14" y="14" width="484" height="484" rx="108" fill="url(#bgGrad)"/>
  <rect x="14" y="14" width="484" height="484" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Inner Ambient Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#centerGlow)"/>

  <!-- Subtle Artboard Alignment Grid -->
  <g opacity="0.18" stroke="#64748B" stroke-width="1">
    <line x1="120" y1="80" x2="120" y2="432" stroke-dasharray="4,6"/>
    <line x1="188" y1="80" x2="188" y2="432" stroke-dasharray="4,6"/>
    <line x1="256" y1="80" x2="256" y2="432" stroke-dasharray="4,6"/>
    <line x1="324" y1="80" x2="324" y2="432" stroke-dasharray="4,6"/>
    <line x1="392" y1="80" x2="392" y2="432" stroke-dasharray="4,6"/>

    <line x1="80" y1="120" x2="432" y2="120" stroke-dasharray="4,6"/>
    <line x1="80" y1="188" x2="432" y2="188" stroke-dasharray="4,6"/>
    <line x1="80" y1="256" x2="432" y2="256" stroke-dasharray="4,6"/>
    <line x1="80" y1="324" x2="432" y2="324" stroke-dasharray="4,6"/>
    <line x1="80" y1="392" x2="432" y2="392" stroke-dasharray="4,6"/>
  </g>

  <!-- Concentric Responsive Viewport Guides -->
  <rect x="76" y="76" width="360" height="360" rx="36" fill="none" stroke="#475569" stroke-opacity="0.3" stroke-width="1.5"/>
  <rect x="110" y="110" width="292" height="292" rx="24" fill="none" stroke="#8B5CF6" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="6,6"/>

  <!-- Design System Artboard Corner Handles -->
  <g fill="#0F172A" stroke="#22D3EE" stroke-width="2">
    <rect x="70" y="70" width="12" height="12" rx="2"/>
    <rect x="430" y="70" width="12" height="12" rx="2"/>
    <rect x="70" y="430" width="12" height="12" rx="2"/>
    <rect x="430" y="430" width="12" height="12" rx="2"/>
    <rect x="250" y="70" width="12" height="12" rx="2" stroke="#D946EF"/>
    <rect x="250" y="430" width="12" height="12" rx="2" stroke="#D946EF"/>
    <rect x="70" y="250" width="12" height="12" rx="2" stroke="#8B5CF6"/>
    <rect x="430" y="250" width="12" height="12" rx="2" stroke="#8B5CF6"/>
  </g>

  <!-- Central WCAG Accessibility Iris / Contrast Aperture -->
  <circle cx="256" cy="256" r="116" fill="url(#irisGlow)"/>

  <!-- High-Contrast Dual Crescent Aperture (WCAG 7:1 Ratio Symbol) -->
  <path d="M 256,152 A 104,104 0 0,0 256,360 A 104,104 0 0,1 256,152 Z" fill="#22D3EE" fill-opacity="0.18" stroke="url(#cyanToViolet)" stroke-width="3.5" filter="url(#softGlow)"/>
  <path d="M 256,152 A 104,104 0 0,1 256,360 A 104,104 0 0,0 256,152 Z" fill="#D946EF" fill-opacity="0.18" stroke="url(#violetToFuchsia)" stroke-width="3.5" filter="url(#softGlow)"/>

  <!-- Optical Iris Rays / Calibration Marks (WCAG Conformance Degrees) -->
  <circle cx="256" cy="256" r="76" fill="none" stroke="#64748B" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3,7"/>
  <circle cx="256" cy="256" r="48" fill="#0F172A" stroke="url(#borderGrad)" stroke-width="2.5"/>
  <circle cx="256" cy="256" r="22" fill="url(#cyanToViolet)"/>
  <circle cx="256" cy="256" r="8" fill="#FFFFFF"/>

  <!-- Sweeping Bezier Vector Splines across the Canvas -->
  <!-- Spline 1: Primary vibrant curve -->
  <path d="M 92,374 C 150,420 200,320 256,256 C 312,192 360,100 420,136" fill="none" stroke="url(#fuchsiaToCyan)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Spline 2: Secondary harmonic curve -->
  <path d="M 96,150 C 170,110 190,220 256,256 C 320,290 350,380 416,364" fill="none" stroke="url(#cyanToViolet)" stroke-width="3" stroke-linecap="round" stroke-dasharray="8,6" opacity="0.8"/>

  <!-- Bezier Control Handles & Tangent Arms -->
  <g stroke="#E2E8F0" stroke-width="1.8" stroke-dasharray="3,3" opacity="0.85">
    <line x1="256" y1="256" x2="310" y2="194"/>
    <line x1="256" y1="256" x2="202" y2="318"/>
  </g>
  <!-- Handle Tangent Knots -->
  <circle cx="310" cy="194" r="5" fill="#22D3EE" stroke="#0F172A" stroke-width="2"/>
  <circle cx="202" cy="318" r="5" fill="#D946EF" stroke="#0F172A" stroke-width="2"/>

  <!-- Precision Bezier Pen Tool (Icon of Craftsmanship & Vector Systems) -->
  <!-- Positioned dynamically crafting the anchor at upper-right -->
  <g transform="translate(366, 178) rotate(-42)">
    <!-- Pen Body / Barrel -->
    <path d="M -16,-62 L 16,-62 L 20,-18 L -20,-18 Z" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <!-- Pen Collar / Ring -->
    <rect x="-18" y="-18" width="36" height="8" rx="2" fill="url(#penAccent)"/>
    <!-- Pen Nib Wings -->
    <path d="M -18,-10 L 18,-10 L 14,32 L 0,58 L -14,32 Z" fill="url(#penNibGrad)" stroke="#64748B" stroke-width="1.8"/>
    <!-- Nib Cutout / Ink Channel -->
    <circle cx="0" cy="18" r="4.5" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    <line x1="0" y1="22" x2="0" y2="58" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Glowing Nib Tip -->
    <circle cx="0" cy="58" r="3.5" fill="#22D3EE" filter="url(#softGlow)"/>
  </g>

  <!-- DTCG Design Token Pills / Semantic Graph Nodes -->
  <!-- Token 1: Color Token {$value: #22D3EE} -->
  <g transform="translate(74, 186)">
    <rect x="0" y="0" width="94" height="26" rx="13" fill="#0F172A" stroke="#06B6D4" stroke-width="1.8" filter="url(#softGlow)"/>
    <circle cx="13" cy="13" r="5" fill="#22D3EE"/>
    <text x="26" y="17" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.4">$color.pri</text>
  </g>

  <!-- Token 2: Radius/Dimension Token {$value: 16px} -->
  <g transform="translate(346, 320)">
    <rect x="0" y="0" width="98" height="26" rx="13" fill="#0F172A" stroke="#D946EF" stroke-width="1.8" filter="url(#softGlow)"/>
    <circle cx="13" cy="13" r="5" fill="#D946EF"/>
    <text x="26" y="17" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" letter-spacing="0.4">$radius.lg</text>
  </g>

  <!-- Token 3: WCAG AAA Badge Pill -->
  <g transform="translate(196, 410)">
    <rect x="0" y="0" width="120" height="26" rx="13" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.8"/>
    <circle cx="14" cy="13" r="5" fill="#10B981"/>
    <text x="26" y="17" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.5">WCAG 2.2 AAA</text>
  </g>
</svg>
