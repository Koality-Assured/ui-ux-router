<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Synthetic button low contrast</title>
  <style>
    * { animation-duration: 0s !important; transition-duration: 0s !important; }
    body { margin: 0; background: #e8e8e8; }
    .btn { min-width: 48px; min-height: 48px; background: #c8c8c8; color: #b0b0b0; border: 0; }
  </style>
</head>
<body data-bg="#e8e8e8">
  <main>
    <button class="btn" type="button" data-role="button" data-bg="#c8c8c8" data-fg="#b0b0b0" data-w="120" data-h="48">Ghost</button>
  </main>
</body>
</html>
