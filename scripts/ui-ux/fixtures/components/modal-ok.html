<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Synthetic modal OK</title>
  <style>
    * { animation-duration: 0s !important; transition-duration: 0s !important; }
    dialog { width: 280px; min-height: 96px; background: #ffffff; color: #1a1a1a; border: 2px solid #1a1a1a; }
    .btn { min-width: 48px; min-height: 48px; background: #0b57d0; color: #ffffff; border: 0; }
  </style>
</head>
<body data-bg="#f4f4f4">
  <main>
    <dialog open role="dialog" aria-modal="true" data-role="dialog" data-bg="#ffffff" data-fg="#1a1a1a" data-w="280" data-h="96">
      <form method="dialog">
        <p>Confirm delete</p>
        <button class="btn" type="submit" data-role="button" data-bg="#0b57d0" data-fg="#ffffff" data-w="96" data-h="48">Close</button>
      </form>
    </dialog>
  </main>
</body>
</html>
