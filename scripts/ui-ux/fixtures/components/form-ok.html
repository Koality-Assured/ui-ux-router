<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Synthetic form OK</title>
  <style>
    * { animation-duration: 0s !important; transition-duration: 0s !important; }
    label { display: block; margin: 8px 0; }
    input { min-height: 48px; min-width: 160px; }
    button { min-width: 48px; min-height: 48px; background: #0b57d0; color: #ffffff; border: 0; }
  </style>
</head>
<body data-bg="#ffffff">
  <main>
    <form>
      <label for="email">Email
        <input id="email" name="email" type="email" autocomplete="email" data-role="input" data-bg="#ffffff" data-fg="#1a1a1a" data-w="200" data-h="48">
      </label>
      <button type="submit" data-role="button" data-bg="#0b57d0" data-fg="#ffffff" data-w="120" data-h="48">Submit</button>
    </form>
  </main>
</body>
</html>
