<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Synthetic unlabeled control</title>
  <style>
    * { animation-duration: 0s !important; transition-duration: 0s !important; }
    input { min-height: 48px; }
  </style>
</head>
<body data-bg="#ffffff">
  <main>
    <form>
      <input name="secret" type="text" data-role="input" data-bg="#ffffff" data-fg="#1a1a1a" data-w="200" data-h="48">
      <button type="submit" data-role="button" data-bg="#0b57d0" data-fg="#ffffff" data-w="120" data-h="48">Go</button>
    </form>
  </main>
</body>
</html>
