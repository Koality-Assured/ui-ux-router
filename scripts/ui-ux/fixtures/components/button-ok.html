<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Synthetic button OK</title>
  <style>
    * { animation-duration: 0s !important; transition-duration: 0s !important; }
    @font-face { font-family: FixtureSans; src: local("Arial"); font-display: block; }
    body { margin: 0; background: #ffffff; font-family: FixtureSans, sans-serif; color: #1a1a1a; }
    .btn { min-width: 48px; min-height: 48px; padding: 12px 20px; background: #0b57d0; color: #ffffff; border: 0; }
  </style>
</head>
<body data-bg="#ffffff">
  <main>
    <button class="btn" type="button" data-role="button" data-bg="#0b57d0" data-fg="#ffffff" data-w="120" data-h="48">Save</button>
  </main>
</body>
</html>
